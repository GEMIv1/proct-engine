video:
  source: 0                   # 0 for default webcam
  resolution: [1280, 720]
  fps: 30
  recording_path: "./recordings"

detection:
  face:
    detection_interval: 5     # frames
    min_confidence: 0.8
    face_absent_threshold: 3  # seconds before flagging face disappeared
  eyes:
    gaze_threshold: 2          # seconds
    iris_up_thresh: 0.45       # ratio for upward gaze classification
    iris_down_thresh: 0.35     # ratio for downward gaze classification
    gaze_left_thresh: 0.45     # ratio for leftward gaze classification
    gaze_right_thresh: 0.60    # ratio for rightward gaze classification
    max_frames_without_detection: 10 # consecutive frames allowed before resetting gaze state
    iris_pupil_blend: 0.7      # weight toward iris-relative vs absolute pupil position
    head_pose_scale: 30.0      # multiplier for scaling eye movements to head pose
    max_frame_dim: 640         # maximum dimension size for MediaPipe processing
  mouth_monitor:
    movement_threshold: 3     # consecutive frames
    open_threshold: 0.03
    width_threshold: 0.2
  multi_face:
    alert_threshold: 5        # frames
  objects:
    model_path: "models/yolo26s_finetuned.pt"  # Path to the YOLO weights file
    min_confidence: 0.65  # Detection confidence threshold
    detection_interval: 5 # frames between detections
    max_fps: 5            # Maximum detection frames per second
  audio_monitoring:
    enabled: true
    sample_rate: 16000
    energy_threshold: 0.001
    zcr_threshold: 0.35
        
alert:
  cooldown: 10                # Minimum seconds between same alert


global:
  severity_levels:
    FACE_DISAPPEARED: 1
    GAZE_AWAY: 2
    MOUTH_MOVING: 3
    MULTIPLE_FACES: 4
    OBJECT_DETECTED: 5
    AUDIO_DETECTED: 3

rabbitmq:
  host: "localhost"
  port: 5672
  user: "admin"
  password: "admin"
  vhost: "/"
  request_queue: "cheating-detection-queue"
  response_queue: "cheating-detection-result-queue"
  submissions_base_path: ""